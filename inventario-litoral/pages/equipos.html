<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elementos — Inventario Litoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div class="flex items-center justify-between mb-5 gap-3 flex-wrap">
                <h1 class="text-xl font-bold">Elementos del inventario</h1>
                <button class="btn-primary" id="btn-nuevo" data-role-only="Administrador,Tecnico">+ Nuevo equipo</button>
            </div>

            <div class="card mb-5">
                <div class="flex gap-3 flex-wrap items-end">
                    <div style="flex:1; min-width:220px;">
                        <label class="field-label">Buscar</label>
                        <input type="text" id="filtro-busqueda" class="surface-input" placeholder="Código, nombre o serial...">
                    </div>
                    <div style="min-width:160px;">
                        <label class="field-label">Estado</label>
                        <select id="filtro-estado" class="surface-input"><option value="">Todos</option></select>
                    </div>
                    <div style="min-width:160px;">
                        <label class="field-label">Categoría</label>
                        <select id="filtro-categoria" class="surface-input"><option value="">Todas</option></select>
                    </div>
                    <div style="min-width:160px;">
                        <label class="field-label">Ubicación</label>
                        <select id="filtro-ubicacion" class="surface-input"><option value="">Todas</option></select>
                    </div>
                    <button class="btn-ghost" id="btn-limpiar-filtros">Limpiar</button>
                </div>
            </div>

            <div class="card">
                <div id="tabla-equipos"></div>
                <div class="flex items-center justify-between mt-4" id="paginacion"></div>
            </div>
        </main>
    </div>

    <div id="modal-container"></div>

    <script src="../js/api/api.js"></script>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/validators/validators.js"></script>
    <script src="../js/services/auth-service.js"></script>
    <script src="../js/services/entity-services.js"></script>
    <script src="../components/sidebar.js"></script>
    <script>
        let usuarioActual = null;
        let paginaActual = 1;
        let catalogos = { tipos_equipo: [], categorias: [], ubicaciones: [], estados: [] };

        (async () => {
            usuarioActual = await AuthService.requireSession();
            if (!usuarioActual) return;

            document.getElementById('sidebar-container').outerHTML = renderSidebar('equipos', usuarioActual);
            activarLogout();
            AuthService.aplicarVisibilidadPorRol(usuarioActual);

            await cargarCatalogos();

            const params = new URLSearchParams(window.location.search);
            if (params.get('busqueda')) document.getElementById('filtro-busqueda').value = params.get('busqueda');

            await cargarEquipos();

            document.getElementById('btn-nuevo').addEventListener('click', () => abrirModalEquipo());
            document.getElementById('btn-limpiar-filtros').addEventListener('click', () => {
                document.getElementById('filtro-busqueda').value = '';
                document.getElementById('filtro-estado').value = '';
                document.getElementById('filtro-categoria').value = '';
                document.getElementById('filtro-ubicacion').value = '';
                paginaActual = 1;
                cargarEquipos();
            });

            let temporizador;
            document.getElementById('filtro-busqueda').addEventListener('input', () => {
                clearTimeout(temporizador);
                temporizador = setTimeout(() => { paginaActual = 1; cargarEquipos(); }, 350);
            });
            ['filtro-estado', 'filtro-categoria', 'filtro-ubicacion'].forEach(id => {
                document.getElementById(id).addEventListener('change', () => { paginaActual = 1; cargarEquipos(); });
            });
        })();

        async function cargarCatalogos() {
            const [tipos, categorias, ubicaciones, estados] = await Promise.all([
                CatalogoService.listar('tipos_equipo'),
                CatalogoService.listar('categorias'),
                CatalogoService.listar('ubicaciones'),
                CatalogoService.listar('estados'),
            ]);
            catalogos.tipos_equipo = tipos.data;
            catalogos.categorias = categorias.data;
            catalogos.ubicaciones = ubicaciones.data;
            catalogos.estados = estados.data;

            const llenar = (id, lista, extra = '') => {
                document.getElementById(id).insertAdjacentHTML('beforeend',
                    lista.map(c => `<option value="${c.id}">${Ui.escapeHtml(c.nombre)}</option>`).join(''));
            };
            llenar('filtro-estado', estados.data);
            llenar('filtro-categoria', categorias.data);
            llenar('filtro-ubicacion', ubicaciones.data);
        }

        async function cargarEquipos() {
            const contenedor = document.getElementById('tabla-equipos');
            contenedor.innerHTML = `<div class="flex justify-center py-8"><span class="spinner" style="border-top-color:#a78bfa;"></span></div>`;

            const filtros = {
                busqueda: document.getElementById('filtro-busqueda').value.trim(),
                estado_id: document.getElementById('filtro-estado').value,
                categoria_id: document.getElementById('filtro-categoria').value,
                ubicacion_id: document.getElementById('filtro-ubicacion').value,
                pagina: paginaActual,
                por_pagina: 8,
            };
            Object.keys(filtros).forEach(k => { if (!filtros[k]) delete filtros[k]; });

            try {
                const res = await EquiposService.listar(filtros);
                pintarTabla(res.data.equipos);
                pintarPaginacion(res.data);
            } catch (err) {
                contenedor.innerHTML = `<div class="empty-state">${Ui.escapeHtml(err.message)}</div>`;
            }
        }

        function pintarTabla(equipos) {
            const contenedor = document.getElementById('tabla-equipos');
            const puedeEditar = ['Administrador', 'Tecnico'].includes(usuarioActual.rol);
            const puedeEliminar = usuarioActual.rol === 'Administrador';

            if (equipos.length === 0) {
                contenedor.innerHTML = `<div class="empty-state">
                    No hay equipos registrados con estos filtros.<br>
                    ${puedeEditar ? 'Registra el primer equipo para comenzar a gestionar el inventario.' : ''}
                </div>`;
                return;
            }

            contenedor.innerHTML = `
                <table class="data-table">
                    <thead><tr>
                        <th>Código</th><th>Nombre</th><th>Estado</th><th>Categoría</th>
                        <th>Ubicación</th><th>Responsable</th><th></th>
                    </tr></thead>
                    <tbody>
                        ${equipos.map(eq => `
                            <tr>
                                <td>${Ui.escapeHtml(eq.codigo_inventario)}</td>
                                <td>${Ui.escapeHtml(eq.nombre)}</td>
                                <td><span class="${Ui.badgeClass(eq.estado_color)}">${Ui.escapeHtml(eq.estado)}</span></td>
                                <td>${Ui.escapeHtml(eq.categoria || '—')}</td>
                                <td>${Ui.escapeHtml(eq.ubicacion || '—')}</td>
                                <td>${Ui.escapeHtml(eq.responsable || '—')}</td>
                                <td class="text-right whitespace-nowrap">
                                    <button class="icon-btn" title="Ver detalle" onclick="verDetalle(${eq.id})">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    </button>
                                    ${puedeEditar ? `<button class="icon-btn" title="Editar" onclick="abrirModalEquipo(${eq.id})">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                    </button>` : ''}
                                    ${puedeEliminar ? `<button class="icon-btn" title="Dar de baja" onclick="eliminarEquipo(${eq.id}, '${Ui.escapeHtml(eq.codigo_inventario)}')">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                                    </button>` : ''}
                                </td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        function pintarPaginacion(data) {
            const el = document.getElementById('paginacion');
            if (data.total_paginas <= 1) { el.innerHTML = ''; return; }
            el.innerHTML = `
                <span class="text-sm" style="color:var(--color-text-muted)">
                    Página ${data.pagina} de ${data.total_paginas} — ${data.total} equipo(s)
                </span>
                <div class="flex gap-2">
                    <button class="btn-ghost" ${data.pagina <= 1 ? 'disabled' : ''} onclick="cambiarPagina(-1)">Anterior</button>
                    <button class="btn-ghost" ${data.pagina >= data.total_paginas ? 'disabled' : ''} onclick="cambiarPagina(1)">Siguiente</button>
                </div>`;
        }

        function cambiarPagina(delta) {
            paginaActual += delta;
            cargarEquipos();
        }

        // ---------- Modal Crear / Editar ----------
        async function abrirModalEquipo(id = null) {
            let equipo = null;
            if (id) {
                try { equipo = (await EquiposService.obtener(id)).data; }
                catch (err) { Ui.toast(err.message, 'error'); return; }
            }

            const opciones = (lista, seleccionado) => lista.map(c =>
                `<option value="${c.id}" ${equipo && seleccionado === c.id ? 'selected' : ''}>${Ui.escapeHtml(c.nombre)}</option>`).join('');

            const html = `
                <div class="modal-overlay" id="modal-equipo">
                    <div class="modal-box" style="max-width:620px;">
                        <h3 class="text-lg font-semibold mb-4">${equipo ? 'Editar equipo' : 'Nuevo equipo'}</h3>
                        <form id="form-equipo" novalidate>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;">
                                <div>
                                    <label class="field-label">Código de inventario</label>
                                    <input id="eq-codigo" class="dark-input" value="${equipo ? Ui.escapeHtml(equipo.codigo_inventario) : ''}">
                                    <p class="text-xs mt-1" style="color:var(--color-danger)" id="eq-codigo-error"></p>
                                </div>
                                <div>
                                    <label class="field-label">Serial (opcional)</label>
                                    <input id="eq-serial" class="dark-input" value="${equipo && equipo.serial ? Ui.escapeHtml(equipo.serial) : ''}">
                                </div>
                                <div style="grid-column:1/-1;">
                                    <label class="field-label">Nombre del equipo</label>
                                    <input id="eq-nombre" class="dark-input" value="${equipo ? Ui.escapeHtml(equipo.nombre) : ''}">
                                    <p class="text-xs mt-1" style="color:var(--color-danger)" id="eq-nombre-error"></p>
                                </div>
                                <div>
                                    <label class="field-label">Tipo</label>
                                    <select id="eq-tipo" class="dark-input">${opciones(catalogos.tipos_equipo, equipo?.tipo_id)}</select>
                                </div>
                                <div>
                                    <label class="field-label">Categoría</label>
                                    <select id="eq-categoria" class="dark-input"><option value="">—</option>${opciones(catalogos.categorias, equipo?.categoria_id)}</select>
                                </div>
                                <div>
                                    <label class="field-label">Ubicación</label>
                                    <select id="eq-ubicacion" class="dark-input"><option value="">—</option>${opciones(catalogos.ubicaciones, equipo?.ubicacion_id)}</select>
                                </div>
                                <div>
                                    <label class="field-label">Estado</label>
                                    <select id="eq-estado" class="dark-input">${opciones(catalogos.estados, equipo?.estado_id)}</select>
                                </div>
                                <div style="grid-column:1/-1;">
                                    <label class="field-label">Características (opcional)</label>
                                    <textarea id="eq-caracteristicas" class="dark-input" rows="2">${equipo && equipo.caracteristicas ? Ui.escapeHtml(equipo.caracteristicas) : ''}</textarea>
                                </div>
                            </div>
                            <p class="text-sm mt-3" style="color:var(--color-danger)" id="form-equipo-error"></p>
                            <div class="flex justify-end gap-2 mt-5">
                                <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
                                <button type="submit" class="btn-primary" id="btn-guardar-equipo">${equipo ? 'Guardar cambios' : 'Registrar equipo'}</button>
                            </div>
                        </form>
                    </div>
                </div>`;
            document.getElementById('modal-container').innerHTML = html;

            document.getElementById('form-equipo').addEventListener('submit', async (e) => {
                e.preventDefault();
                document.getElementById('form-equipo-error').textContent = '';

                const esValido = Validators.validarFormulario({
                    'eq-codigo': [Validators.requerido, Validators.codigoInventario],
                    'eq-nombre': [Validators.requerido],
                });
                if (!esValido) return;

                const payload = {
                    id: equipo?.id,
                    codigo_inventario: document.getElementById('eq-codigo').value.trim(),
                    serial: document.getElementById('eq-serial').value.trim(),
                    nombre: document.getElementById('eq-nombre').value.trim(),
                    tipo_id: document.getElementById('eq-tipo').value,
                    categoria_id: document.getElementById('eq-categoria').value || null,
                    ubicacion_id: document.getElementById('eq-ubicacion').value || null,
                    estado_id: document.getElementById('eq-estado').value,
                    caracteristicas: document.getElementById('eq-caracteristicas').value.trim(),
                };

                const btn = document.getElementById('btn-guardar-equipo');
                Ui.setLoading(btn, true);
                try {
                    if (equipo) {
                        await EquiposService.actualizar(payload);
                        Ui.toast('Equipo actualizado correctamente.');
                    } else {
                        await EquiposService.crear(payload);
                        Ui.toast('Equipo registrado correctamente.');
                    }
                    cerrarModal();
                    cargarEquipos();
                } catch (err) {
                    document.getElementById('form-equipo-error').textContent =
                        err.errors && err.errors.length ? err.errors.join(' ') : err.message;
                } finally {
                    Ui.setLoading(btn, false, equipo ? 'Guardar cambios' : 'Registrar equipo');
                }
            });
        }

        function cerrarModal() {
            document.getElementById('modal-container').innerHTML = '';
        }

        async function eliminarEquipo(id, codigo) {
            const ok = await Ui.confirmar(
                `¿Dar de baja el equipo ${codigo}?`,
                'Esta acción puede afectar información relacionada (asignaciones, mantenimientos). El historial del equipo se conservará.'
            );
            if (!ok) return;
            try {
                const res = await EquiposService.eliminar(id);
                Ui.toast(res.message);
                cargarEquipos();
            } catch (err) {
                Ui.toast(err.message, 'error');
            }
        }

        async function verDetalle(id) {
            try {
                const res = await EquiposService.obtener(id);
                const eq = res.data;
                const historialHtml = eq.historial.length
                    ? eq.historial.map(h => `
                        <div style="padding:0.6rem 0;border-bottom:1px solid var(--color-border);">
                            <div class="flex justify-between">
                                <span class="font-medium">${Ui.escapeHtml(h.accion)}</span>
                                <span class="text-xs" style="color:var(--color-text-muted)">${Ui.formatFecha(h.fecha)}</span>
                            </div>
                            <div class="text-sm" style="color:var(--color-text-muted)">${Ui.escapeHtml(h.detalle || '')} — ${Ui.escapeHtml(h.usuario_nombre || 'Sistema')}</div>
                        </div>`).join('')
                    : '<p class="text-sm" style="color:var(--color-text-muted)">Sin movimientos registrados.</p>';

                document.getElementById('modal-container').innerHTML = `
                    <div class="modal-overlay">
                        <div class="modal-box" style="max-width:560px;">
                            <h3 class="text-lg font-semibold mb-1">${Ui.escapeHtml(eq.nombre)}</h3>
                            <p class="text-sm mb-4" style="color:var(--color-text-muted)">${Ui.escapeHtml(eq.codigo_inventario)} · ${Ui.escapeHtml(eq.serial || 'sin serial')}</p>
                            <h4 class="text-sm font-semibold mb-2">Historial / Trazabilidad</h4>
                            <div style="max-height:320px;overflow-y:auto;">${historialHtml}</div>
                            <div class="flex justify-end mt-5">
                                <button class="btn-ghost" onclick="cerrarModal()">Cerrar</button>
                            </div>
                        </div>
                    </div>`;
            } catch (err) {
                Ui.toast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
