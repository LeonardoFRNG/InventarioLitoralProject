<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Litoral — Iniciar sesión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="flex flex-col items-center mb-6">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" style="width:40px;height:40px;margin-bottom:0.75rem;">
                    <path d="M2 8c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                    <path d="M2 14c2-2 4-2 6 0s4 2 6 0 4-2 6 0"/>
                </svg>
                <h1 class="text-xl font-bold text-center">Inventario Litoral</h1>
            </div>

            <form id="form-login" novalidate>
                <div class="mb-4">
                    <label class="field-label" for="email">Email</label>
                    <input type="email" id="email" class="surface-input" placeholder="admin@litoral.com" autocomplete="username" required>
                    <p class="text-xs mt-1" style="color:var(--color-danger)" id="email-error"></p>
                </div>

                <div class="mb-2">
                    <label class="field-label" for="password">Contraseña</label>
                    <input type="password" id="password" class="surface-input" placeholder="••••••••" autocomplete="current-password" required>
                    <p class="text-xs mt-1" style="color:var(--color-danger)" id="password-error"></p>
                </div>

                <p class="text-sm mt-4 mb-2" style="color:var(--color-danger)" id="form-error"></p>

                <button type="submit" id="btn-login" class="btn-primary w-full mt-2" style="width:100%;">
                    Ingresar
                </button>
            </form>

            <p class="text-center text-sm mt-5">
                <a href="#" style="color:#93c5fd;" id="link-olvide">¿Olvidaste tu contraseña?</a>
            </p>
        </div>
    </div>

    <script src="../js/api/api.js"></script>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/validators/validators.js"></script>
    <script src="../js/services/auth-service.js"></script>
    <script>
        // Si ya hay sesión activa, saltar directo al dashboard
        (async () => {
            try {
                await AuthService.me();
                window.location.href = 'dashboard.html';
            } catch { /* no hay sesión: se queda en login */ }
        })();

        document.getElementById('form-login').addEventListener('submit', async (e) => {
            e.preventDefault();
            document.getElementById('form-error').textContent = '';

            const esValido = Validators.validarFormulario({
                email:    [Validators.requerido, Validators.email],
                password: [Validators.requerido],
            });
            if (!esValido) return;

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btn-login');

            Ui.setLoading(btn, true);
            try {
                await AuthService.login(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                document.getElementById('form-error').textContent = err.message;
            } finally {
                Ui.setLoading(btn, false, 'Ingresar');
            }
        });

        document.getElementById('link-olvide').addEventListener('click', (e) => {
            e.preventDefault();
            Ui.toast('Contacta al administrador del sistema para restablecer tu contraseña.', 'error');
        });
    </script>
</body>
</html>
