<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mantenimientos — Inventario Litoral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="../css/utilities.css">
</head>
<body>
    <div class="app-shell">
        <div id="sidebar-container"></div>
        <main class="main-content">
            <div class="flex items-center justify-between mb-5 gap-3 flex-wrap">
                <h1 class="text-xl font-bold">Mantenimientos</h1>
                <button class="btn-primary" id="btn-nuevo" data-role-only="Administrador,Tecnico">+ Nuevo mantenimiento</button>
            </div>
            <div class="card"><div class="table-scroll"><div id="tabla-mantenimientos"></div></div></div>
        </main>
    </div>
    <div id="modal-container"></div>

    <script src="../js/api/api.js"></script>
    <script src="../js/utils/ui.js"></script>
    <script src="../js/validators/validators.js"></script>
    <script src="../js/services/auth-service.js"></script>
    <script src="../js/services/entity-services.js"></script>
    <script src="../components/logo.js"></script>
    <script src="../components/sidebar.js"></script>
    <script>
        let usuarioActual = null;
        let equiposDisponibles = [];
        let estadosDisponibles = [];

        (async () => {
            usuarioActual = await AuthService.requireSession();
            if (!usuarioActual) return;

            document.getElementById('sidebar-container').outerHTML = renderSidebar('mantenimientos', usuarioActual);
            activarLogout();
            activarMenuMovil();
            AuthService.aplicarVisibilidadPorRol(usuarioActual);

            await cargarMantenimientos();
            document.getElementById('btn-nuevo').addEventListener('click', abrirModal);
        })();

        async function cargarMantenimientos() {
            const contenedor = document.getElementById('tabla-mantenimientos');
            contenedor.innerHTML = `<div class="flex justify-center py-8"><span class="spinner" style="border-top-color:#a78bfa;"></span></div>`;
            try {
                const res = await MantenimientosService.listar();
                pintarTabla(res.data);
            } catch (err) {
                contenedor.innerHTML = `<div class="empty-state">${Ui.escapeHtml(err.message)}</div>`;
            }
        }

        function pintarTabla(mantenimientos) {
            const contenedor = document.getElementById('tabla-mantenimientos');
            if (mantenimientos.length === 0) {
                contenedor.innerHTML = `<div class="empty-state">No hay mantenimientos registrados todavía.</div>`;
                return;
            }
            contenedor.innerHTML = `
                <table class="data-table">
                    <thead><tr>
                        <th>Equipo</th><th>Tipo</th><th>Descripción</th><th>Técnico</th>
                        <th>Inicio</th><th>Fin</th><th>Resultado</th>
                    </tr></thead>
                    <tbody>
                        ${mantenimientos.map(m => `
                            <tr>
                                <td>${Ui.escapeHtml(m.codigo_inventario)} — ${Ui.escapeHtml(m.equipo_nombre)}</td>
                                <td><span class="badge ${m.tipo_mantenimiento === 'CORRECTIVO' ? 'badge-orange' : 'badge-gray'}">${m.tipo_mantenimiento}</span></td>
                                <td>${Ui.escapeHtml(m.descripcion)}</td>
                                <td>${Ui.escapeHtml(m.tecnico_nombre)}</td>
                                <td>${Ui.formatFecha(m.fecha_inicio)}</td>
                                <td>${m.fecha_fin ? Ui.formatFecha(m.fecha_fin) : '<span style="color:var(--color-warning)">En curso</span>'}</td>
                                <td>${m.estado_resultante ? Ui.escapeHtml(m.estado_resultante) : '—'}</td>
                            </tr>`).join('')}
                    </tbody>
                </table>`;
        }

        async function abrirModal() {
            if (equiposDisponibles.length === 0) {
                const res = await EquiposService.listar({ por_pagina: 100 });
                equiposDisponibles = res.data.equipos;
            }
            if (estadosDisponibles.length === 0) {
                const res = await CatalogoService.listar('estados');
                estadosDisponibles = res.data;
            }

            document.getElementById('modal-container').innerHTML = `
                <div class="modal-overlay">
                    <div class="modal-box" style="max-width:560px;">
                        <h3 class="text-lg font-semibold mb-4">Nuevo mantenimiento</h3>
                        <form id="form-mantenimiento" novalidate>
                            <div class="mb-3">
                                <label class="field-label">Equipo</label>
                                <select id="mt-equipo" class="dark-input">
                                    ${equiposDisponibles.map(e => `<option value="${e.id}">${Ui.escapeHtml(e.codigo_inventario)} — ${Ui.escapeHtml(e.nombre)}</option>`).join('')}
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="field-label">Tipo de mantenimiento</label>
                                <select id="mt-tipo" class="dark-input">
                                    <option value="PREVENTIVO">Preventivo</option>
                                    <option value="CORRECTIVO">Correctivo</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="field-label">Descripción</label>
                                <textarea id="mt-descripcion" class="dark-input" rows="3"></textarea>
                                <p class="text-xs mt-1" style="color:var(--color-danger)" id="mt-descripcion-error"></p>
                            </div>
                            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.9rem;">
                                <div>
                                    <label class="field-label">Fecha de inicio</label>
                                    <input id="mt-fecha-inicio" type="date" class="dark-input" value="${new Date().toISOString().slice(0,10)}">
                                </div>
                                <div>
                                    <label class="field-label">Fecha de fin (opcional)</label>
                                    <input id="mt-fecha-fin" type="date" class="dark-input">
                                    <p class="text-xs mt-1" style="color:var(--color-danger)" id="mt-fecha-fin-error"></p>
                                </div>
                            </div>
                            <div class="mb-3 mt-3">
                                <label class="field-label">Estado resultante del equipo (opcional)</label>
                                <select id="mt-estado" class="dark-input">
                                    <option value="">No actualizar estado</option>
                                    ${estadosDisponibles.map(e => `<option value="${e.id}">${Ui.escapeHtml(e.nombre)}</option>`).join('')}
                                </select>
                            </div>
                            <p class="text-sm mt-1" style="color:var(--color-danger)" id="form-mantenimiento-error"></p>
                            <div class="flex justify-end gap-2 mt-5">
                                <button type="button" class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
                                <button type="submit" class="btn-primary" id="btn-guardar-mantenimiento">Registrar</button>
                            </div>
                        </form>
                    </div>
                </div>`;

            document.getElementById('form-mantenimiento').addEventListener('submit', async (e) => {
                e.preventDefault();
                document.getElementById('form-mantenimiento-error').textContent = '';

                const fechaInicio = document.getElementById('mt-fecha-inicio').value;
                const fechaFin = document.getElementById('mt-fecha-fin').value;

                const esValido = Validators.validarFormulario({
                    'mt-descripcion': [Validators.requerido],
                    'mt-fecha-fin': [(v) => Validators.rangoFechas(fechaInicio, v)],
                });
                if (!esValido) return;

                const payload = {
                    equipo_id: document.getElementById('mt-equipo').value,
                    tipo_mantenimiento: document.getElementById('mt-tipo').value,
                    descripcion: document.getElementById('mt-descripcion').value.trim(),
                    fecha_inicio: fechaInicio,
                    fecha_fin: fechaFin || null,
                    estado_resultante_id: document.getElementById('mt-estado').value || null,
                };
                const btn = document.getElementById('btn-guardar-mantenimiento');
                Ui.setLoading(btn, true);
                try {
                    await MantenimientosService.crear(payload);
                    Ui.toast('Mantenimiento registrado correctamente.');
                    cerrarModal();
                    cargarMantenimientos();
                } catch (err) {
                    document.getElementById('form-mantenimiento-error').textContent =
                        err.errors && err.errors.length ? err.errors.join(' ') : err.message;
                } finally {
                    Ui.setLoading(btn, false, 'Registrar');
                }
            });
        }

        function cerrarModal() { document.getElementById('modal-container').innerHTML = ''; }
    </script>
</body>
</html>
